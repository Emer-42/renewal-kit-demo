<!DOCTYPE html>
<!-- $banner -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
  body { font: 15px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  h2 { font-size: 1.05rem; border-bottom: 1px solid #ccc; padding-bottom: .2rem; margin-top: 1.4rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #eee; vertical-align: top; }
  .meta { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<h1>$title</h1>
<p class="meta">Account: $account · Numbers: $source, $window</p>
$sections

<table>
<thead><tr><th>Metric</th><th>First</th><th>Last</th><th>Change</th><th>Low / high</th></tr></thead>
<tbody>
$number_rows
</tbody>
</table>
</body>
</html>
